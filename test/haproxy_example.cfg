defaults
    option httplog
    mode http
    log stdout format raw local0
    timeout client 10s
    timeout connect 10s
    timeout server 10s

global
    lua-load /tmp/haproxy_ja4h.lua

frontend test_ja4h
    bind :6969

    # create fingerprint
    http-request lua.fingerprint_ja4h

    # log it
    http-request capture var(txn.fingerprint_ja4h_raw) len 200
    http-request capture var(txn.fingerprint_ja4h) len 51

    http-request return status 200 content-type "text/html" lf-file /tmp/index.html
